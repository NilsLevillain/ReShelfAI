[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reshelf-api"
version = "0.1.0"
description = "Stock allocation optimizer for second life channels"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "pydantic>=2.5.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.12.0",
    "pulp>=3.3,<4",
    "uvicorn>=0.24.0",
    "python-multipart>=0.0.6",
    "numpy>=1.26.0",
    "pyyaml>=6.0",
    "pandas>=2.1.0",
    "pandera>=0.20.0",
    "highspy>=1.7.0",
    "pyarrow>=15.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.25.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "types-setuptools>=69.0.0",
    "types-pyyaml>=6.0",
    "pandas-stubs>=2.1.0",
    "hypothesis>=6.100.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "A", "RUF"]
ignore = ["E501"]

[tool.mypy]
mypy_path = "../../data/generator"
python_version = "3.11"
strict = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["pulp.*", "highspy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "reshelf.adapters.source_schemas"
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests", "../../data/generator/tests"]
pythonpath = ["src", "../../data/generator"]
asyncio_mode = "auto"
markers = ["slow: solves many generated worlds, deselect with -m 'not slow'"]
